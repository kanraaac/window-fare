<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>윈도우항공 · 김해/김포 기간 왕복</title>
  <link rel="stylesheet" href="/assets/styles.css?v=6" />
</head>
<body>
  <div class="bg-grid"></div>
  <header class="top">
    <div class="brand">
      <span class="mark">PUS</span>
      <div>
        <h1>윈도우항공</h1>
        <p>가능한 기간 안의 왕복 후보를 전부 만들고, 싼 것부터 봅니다.</p>
      </div>
    </div>
    <a class="legacy" href="https://kanraaac.github.io/flight-compare-static/" target="_blank" rel="noopener">기존 비교/마일 판단</a>
  </header>

  <main>
    <section class="panel">
      <div class="row origins">
        <span class="lbl">출발(왕복 같은 공항)</span>
        <label class="chip on"><input type="checkbox" name="origin" value="PUS" checked /> 김해 PUS</label>
        <label class="chip"><input type="checkbox" name="origin" value="GMP" /> 김포 GMP</label>
        <label class="chip"><input type="checkbox" name="origin" value="ICN" /> 인천 ICN</label>
      </div>

      <div class="grid-2">
        <label>여행 가능 시작
          <input type="date" id="start" />
        </label>
        <label>여행 가능 종료
          <input type="date" id="end" />
        </label>
      </div>

      <div>
        <span class="lbl">체류 일수 (가는 날~오는 날 포함)</span>
        <div id="duration-chips" class="chips"></div>
      </div>

      <div>
        <span class="lbl">목적지</span>
        <div class="chips">
          <button type="button" class="chip" data-region="japan">일본</button>
          <button type="button" class="chip" data-region="sea">동남아</button>
          <button type="button" class="chip" data-region="greater-china">중화권</button>
          <button type="button" class="chip" data-region="pacific">괌</button>
          <button type="button" class="chip" data-region="domestic">국내</button>
          <button type="button" class="chip on" data-region="other" id="other-chip">그외</button>
        </div>
        <div id="other-air-wrap" class="other-air-wrap">
          <label>그외 공항 1
            <select id="air1" class="air-pick"></select>
          </label>
          <label>그외 공항 2
            <select id="air2" class="air-pick"></select>
          </label>
          <label>그외 공항 3
            <select id="air3" class="air-pick"></select>
          </label>
        </div>
      </div>

      <div class="grid-3">
        <label>성인
          <input type="number" id="adults" min="1" max="9" value="1" />
        </label>
        <label class="checkline"><input type="checkbox" id="nonstop" /> 직항만</label>
        <label>최대 금액(원, 비우면 무제한)
          <input type="number" id="max-price" min="0" step="10000" placeholder="예: 300000" />
        </label>
      </div>

      <div class="actions">
        <button type="button" id="search-btn">이 기간 전부 검색</button>
        <p id="preview" class="hint">시작/종료일을 고르면 후보 개수가 나옵니다.</p>
      </div>
    </section>

    <section class="toolbar hidden" id="toolbar">
      <div class="progress"><span id="progress-bar"></span></div>
      <div class="tools">
        <span id="status">대기</span>
        <label>정렬
          <select id="sort">
            <option value="price">최저가</option>
            <option value="days-asc">짧은 일정</option>
            <option value="days-desc">긴 일정</option>
            <option value="out-asc">출발 빠른순</option>
            <option value="out-desc">출발 늦은순</option>
            <option value="dest">목적지</option>
            <option value="duration">총 비행시간</option>
            <option value="direct">직항 우선</option>
          </select>
        </label>
        <label>묶기
          <select id="group">
            <option value="none">안 묶음</option>
            <option value="dest">목적지별</option>
            <option value="days">일수별</option>
            <option value="origin">출발 공항별</option>
          </select>
        </label>
      </div>
    </section>

    <section id="heatmap" class="heatmap hidden"></section>
    <section id="results"></section>

    <section class="deals">
      <h2>메타검색 · 여행사 특가</h2>
      <p class="hint">네이버 실시간 요금과 함께, 스카이스캐너/여행사에서 한 번 더 대조하세요.</p>
      <div id="deal-links" class="deal-grid"></div>
    </section>
  </main>

  <footer>
    개인용 탐색기 · 요금은 네이버 항공권 검색 결과를 모은 참고가입니다. 결제 전 공식/OTA에서 재확인하세요.
  </footer>
  <script src="/assets/app.js?v=9"></script>
  <script>
    (function () {
      document.querySelectorAll("[data-region]").forEach(function (btn) {
        btn.classList.toggle("on", btn.getAttribute("data-region") === "other");
      });
      var wrap = document.getElementById("other-air-wrap");
      if (wrap) wrap.classList.remove("hidden");
    })();
  </script>
</body>
</html>
